[project]
name = "texture_pig"
version = "0.1.0"
description = "Node-based procedural image creation with a Qt editor"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robin Grotenfelt" }]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    # headless: only cv2 array ops are used (resize, etc.), never cv2.imshow/
    # highgui -- the regular wheel bundles its own Qt, which only duplicates
    # PySide6's and bloats the packaged app.
    "opencv-python-headless>=4.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# No public repo URL yet -- this is a personal spare-time project, not tied to
# any employer. Add a [project.urls] section back once it has a new home
# (GitHub/GitLab/etc.).

[project.scripts]
texture-pig-editor = "texture_pig.ui.qt_editor:run"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"texture_pig.ui" = ["qss/*.qss"]

[tool.setuptools]
include-package-data = true
# The package root (texture_pig) *is* this repository directory -- there's no
# separate src/texture_pig subfolder -- so auto-discovery can't tell "nodes",
# "ui", etc. apart from unrelated top-level packages. Map them explicitly.
package-dir = { "texture_pig" = "." }
packages = [
    "texture_pig",
    "texture_pig.nodes",
    "texture_pig.nodes.scalar",
    "texture_pig.ui",
    "texture_pig.ui.commands",
    "texture_pig.ui.inspector",
    "texture_pig.ui.nodes",
    "texture_pig.ui.palette",
    "texture_pig.ui.preview",
    "texture_pig.ui.scene",
    "texture_pig.ui.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

