[project]
name = "texture_pig"
version = "0.1.0"
description = "Node-based procedural image creation with a Qt editor"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robin Grotenfelt" }]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    # headless: only cv2 array ops are used (resize, etc.), never cv2.imshow/
    # highgui -- the regular wheel bundles its own Qt, which only duplicates
    # PySide6's and bloats the packaged app.
    "opencv-python-headless>=4.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/groovemeteor/texturepig"
Issues = "https://github.com/groovemeteor/texturepig/issues"

[project.scripts]
texture-pig-editor = "texture_pig.ui.qt_editor:run"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"texture_pig.ui" = ["qss/*.qss", "icons/*", "*.rcc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package straight from src/ without needing an install first.
pythonpath = ["src"]

