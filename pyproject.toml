[project]
name = "texture_pig"
version = "0.1.0"
description = "Node-based procedural image creation with a Qt editor"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Robin Grotenfelt" }]
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "PySide6>=6.6",
]

[project.urls]
Homepage = "https://github.com/<your-user-or-org>/texture_pig"
Issues = "https://github.com/<your-user-or-org>/texture_pig/issues"

[project.scripts]
texture-pig-editor = "texture_pig.ui.qt_editor:run"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"texture_pig.ui" = ["qss/*.qss"]

[tool.setuptools]
include-package-data = true

