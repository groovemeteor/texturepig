name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # PySide6 needs a Qt platform plugin even for headless QCoreApplication
      # usage in some environments; offscreen avoids requiring a real display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system libs (PySide6 / OpenCV runtime deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install package + dev dependencies
        run: pip install --disable-pip-version-check -e ".[dev]"

      - name: Run tests
        run: pytest -v
