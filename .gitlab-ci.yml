stages:
  - test

test:
  stage: test
  image: python:3.11-slim
  variables:
    # PySide6 needs a Qt platform plugin even for headless QCoreApplication
    # usage in some environments; offscreen avoids requiring a real display.
    QT_QPA_PLATFORM: "offscreen"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  before_script:
    # opencv-python and PySide6 need these system libs on a slim/headless image
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 > /dev/null
    - pip install --disable-pip-version-check -e ".[dev]"
  script:
    - pytest -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev2"'
